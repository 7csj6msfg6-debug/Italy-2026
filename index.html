<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#184f3b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Italy 2026" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Italy 2026 Itinerary</title>
  <style>
    :root { --bg:#f6f3ea; --card:#fffdf8; --text:#1d2a24; --muted:#6b746f; --accent:#184f3b; --accent2:#c79b52; --border:#ddd7ca; --shadow:0 8px 24px rgba(20,35,28,.08); }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    button, input, textarea { font:inherit; }
    .app { max-width:760px; margin:auto; padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom)); }
    header { padding:22px 4px 12px; }
    h1 { margin:0; font-size:30px; line-height:1.1; }
    .subtitle { color:var(--muted); margin-top:7px; }
    .hero { background:linear-gradient(135deg,var(--accent),#2f765d); color:white; border-radius:24px; padding:20px; box-shadow:var(--shadow); margin:10px 0 16px; }
    .hero .route { font-size:18px; font-weight:700; margin-top:7px; }
    .hero .countdown { margin-top:12px; font-size:14px; opacity:.92; }
    .tabs { display:flex; gap:8px; overflow-x:auto; padding:4px 0 12px; scrollbar-width:none; }
    .tabs::-webkit-scrollbar { display:none; }
    .tab { border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:999px; padding:10px 14px; white-space:nowrap; }
    .tab.active { background:var(--accent); color:white; border-color:var(--accent); }
    .section-title { display:flex; justify-content:space-between; align-items:center; margin:8px 2px 10px; }
    .section-title h2 { font-size:20px; margin:0; }
    .small { color:var(--muted); font-size:13px; }
    .day { background:var(--card); border:1px solid var(--border); border-radius:20px; margin-bottom:12px; overflow:hidden; box-shadow:0 3px 14px rgba(20,35,28,.04); }
    .day-head { width:100%; display:flex; align-items:center; justify-content:space-between; text-align:left; padding:16px; border:0; background:transparent; color:inherit; }
    .day-title { font-weight:750; }
    .day-city { color:var(--accent); font-size:13px; margin-top:3px; }
    .day-body { padding:0 16px 16px; display:none; }
    .day.open .day-body { display:block; }
    .event { display:grid; grid-template-columns:72px 1fr; gap:10px; padding:11px 0; border-top:1px solid var(--border); }
    .time { font-weight:700; color:var(--accent); }
    .event-title { font-weight:700; }
    .event-note { color:var(--muted); font-size:14px; margin-top:3px; line-height:1.35; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .link, .secondary { display:inline-flex; align-items:center; justify-content:center; min-height:38px; border-radius:12px; padding:8px 11px; text-decoration:none; border:1px solid var(--border); color:var(--text); background:white; }
    .link.primary { background:var(--accent); color:white; border-color:var(--accent); }
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .info { background:var(--card); border:1px solid var(--border); border-radius:17px; padding:14px; }
    .info b { display:block; margin-bottom:5px; }
    .checkrow { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--border); }
    .checkrow input { width:20px; height:20px; margin-top:1px; }
    .note-box { width:100%; min-height:95px; border:1px solid var(--border); border-radius:14px; padding:12px; background:white; color:var(--text); }
    .save { margin-top:8px; background:var(--accent); color:white; border:0; border-radius:12px; padding:10px 14px; }
    nav { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(10px + env(safe-area-inset-bottom)); width:min(730px,calc(100% - 20px)); background:rgba(255,253,248,.95); backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:22px; display:grid; grid-template-columns:repeat(4,1fr); padding:7px; box-shadow:var(--shadow); z-index:10; }
    .navbtn { border:0; background:transparent; border-radius:14px; padding:9px 4px; font-size:12px; color:var(--muted); }
    .navbtn.active { background:var(--accent); color:white; }
    .hidden { display:none !important; }
    .empty { padding:24px; text-align:center; color:var(--muted); }
    @media (max-width:480px){ .info-grid{grid-template-columns:1fr;} h1{font-size:27px;} .event{grid-template-columns:62px 1fr;} }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>Italy 2026</h1>
    <div class="subtitle">September 15–27 · Venice → Florence → Rome → Naples</div>
  </header>

  <section class="hero">
    <div>Alberto’s Italy trip</div>
    <div class="route">4 cities · 12 nights · no rental car</div>
    <div class="countdown" id="countdown"></div>
  </section>

  <div id="todayView" class="view"></div>
  <div id="tripView" class="view hidden"></div>
  <div id="bookingsView" class="view hidden"></div>
  <div id="notesView" class="view hidden"></div>
</div>

<nav>
  <button class="navbtn active" data-view="todayView">Today</button>
  <button class="navbtn" data-view="tripView">Trip</button>
  <button class="navbtn" data-view="bookingsView">Bookings</button>
  <button class="navbtn" data-view="notesView">Notes</button>
</nav>

<script>
const trip = [
  {date:'2026-09-15', city:'Venice', title:'Arrival in Venice', events:[
    {time:'10:00 AM', title:'Arrive in Venice', note:'Transfer from the airport to Rio Hotel. Alilaguna water bus is the likely option.'},
    {time:'Afternoon', title:'Check in and explore', note:'Easy first-day walk around St. Mark’s Square and nearby canals.'},
    {time:'Evening', title:'Relaxed Venice evening', note:'Keep this light after the overnight flight.'}
  ]},
  {date:'2026-09-16', city:'Venice', title:'Full Venice day', events:[
    {time:'Morning', title:'Central Venice sightseeing', note:'St. Mark’s area, Rialto, canals, and neighborhoods.'},
    {time:'Evening', title:'Gondola or scenic walk', note:'Best kept flexible depending on weather and energy.'}
  ]},
  {date:'2026-09-17', city:'Florence', title:'Train to Florence', events:[
    {time:'9:26 AM', title:'Frecciarossa 9411', note:'Venice → Florence. Arrives Firenze SMN at 11:39 AM.'},
    {time:'12:00 PM', title:'Check in', note:'B&B A Florence View, next to the Duomo.'},
    {time:'Afternoon', title:'Historic center walk', note:'Duomo area, Piazza della Signoria, Ponte Vecchio.'}
  ]},
  {date:'2026-09-18', city:'Florence', title:'Florence museums and Duomo', events:[
    {time:'Morning', title:'Accademia / Duomo', note:'Final order depends on your timed-entry reservations.'},
    {time:'Afternoon', title:'Uffizi Gallery', note:'Allow roughly 2–3 hours.'},
    {time:'Evening', title:'Sunset viewpoint', note:'Piazzale Michelangelo is a strong option.'}
  ]},
  {date:'2026-09-19', city:'Florence', title:'Tuscany wine experience', events:[
    {time:'Morning', title:'Free Florence time', note:'Keep the morning relaxed before the tour.'},
    {time:'2:30 PM', title:'Wine Experience in Tuscany', note:'Booked with Prestige Rent.'}
  ]},
  {date:'2026-09-20', city:'Rome', title:'Train to Rome', events:[
    {time:'10:03 AM', title:'Italo 8953', note:'Florence → Rome. Arrives at 11:40 AM.'},
    {time:'Afternoon', title:'Check in and historic center', note:'Temple View GuestHouse. Explore Pantheon, Trevi Fountain, and nearby piazzas.'}
  ]},
  {date:'2026-09-21', city:'Rome', title:'Ancient Rome', events:[
    {time:'TBD', title:'Colosseum, Forum and Palatine Hill', note:'Target date for your official Colosseum ticket. Exact entry time still to be added.'}
  ]},
  {date:'2026-09-22', city:'Rome', title:'Vatican City', events:[
    {time:'9:00 AM', title:'Vatican Museums', note:'Timed entry confirmed.'},
    {time:'1:30 PM', title:'St. Peter’s Basilica', note:'Ticket confirmed with lift access.'}
  ]},
  {date:'2026-09-23', city:'Rome', title:'Flexible Rome day', events:[
    {time:'Morning', title:'Open sightseeing block', note:'Can be used for anything missed, Borghese, Trastevere, or a second ancient-Rome date.'}
  ]},
  {date:'2026-09-24', city:'Naples', title:'Train to Naples', events:[
    {time:'9:41 AM', title:'Italo 9967', note:'Rome → Naples. Arrives at 10:53 AM.'},
    {time:'Late morning', title:'Check in', note:'Napolinn B&B.'},
    {time:'Afternoon', title:'Explore Naples', note:'Historic center, pizza, and waterfront depending on energy.'}
  ]},
  {date:'2026-09-25', city:'Capri', title:'Capri day trip', events:[
    {time:'Morning', title:'Ferry Naples → Capri', note:'Final ferry time and ticket details to be added.'},
    {time:'2:00 PM', title:'Small-group boat tour', note:'Booked. Grottoes, swimming, and limoncello.'},
    {time:'6:00 PM', title:'Return ferry', note:'You planned around a 6:00 PM return.'}
  ]},
  {date:'2026-09-26', city:'Naples', title:'Pompeii and Vesuvius', events:[
    {time:'TBD', title:'Pompeii + Mt. Vesuvius tour', note:'Booked. Add the final meeting point and departure time from the confirmation.'}
  ]},
  {date:'2026-09-27', city:'Naples', title:'Departure', events:[
    {time:'7:40 AM', title:'Flight home', note:'Plan a very early airport transfer from Napolinn B&B.'}
  ]}
];

const bookings = [
  ['Venice hotel','Rio Hotel','Sep 15–17'],
  ['Florence hotel','B&B A Florence View','Sep 17–20'],
  ['Rome hotel','Temple View GuestHouse','Sep 20–24'],
  ['Naples hotel','Napolinn B&B','Sep 24–27'],
  ['Train','Frecciarossa 9411','Sep 17 · 9:26 AM'],
  ['Train','Italo 8953','Sep 20 · 10:03 AM'],
  ['Train','Italo 9967','Sep 24 · 9:41 AM'],
  ['Tour','Wine Experience in Tuscany','Sep 19 · 2:30 PM'],
  ['Ticket','Vatican Museums','Sep 22 · 9:00 AM'],
  ['Ticket','St. Peter’s Basilica + lift','Sep 22 · 1:30 PM'],
  ['Tour','Capri small-group boat tour','Sep 25 · 2:00 PM'],
  ['Tour','Pompeii + Mt. Vesuvius','Sep 26 · time TBD']
];

const fmt = d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
function renderDay(day, open=false){
  const id='d'+day.date;
  const events=day.events.map(e=>`<div class="event"><div class="time">${e.time}</div><div><div class="event-title">${e.title}</div><div class="event-note">${e.note}</div></div></div>`).join('');
  return `<article class="day ${open?'open':''}"><button class="day-head" aria-expanded="${open}"><div><div class="day-title">${fmt(day.date)} · ${day.title}</div><div class="day-city">${day.city}</div></div><span>⌄</span></button><div class="day-body">${events}<label class="checkrow"><input type="checkbox" data-check="${id}" ${localStorage.getItem(id)==='1'?'checked':''}><span><b>Mark day complete</b><div class="small">Saved on this device.</div></span></label></div></article>`;
}

function renderToday(){
  const today=new Date();
  const iso=today.toISOString().slice(0,10);
  let current=trip.find(d=>d.date===iso);
  let title='Next trip day';
  if(!current){ current=trip.find(d=>d.date>iso) || trip[trip.length-1]; }
  else title='Today in Italy';
  document.getElementById('todayView').innerHTML=`<div class="section-title"><h2>${title}</h2><span class="small">${fmt(current.date)}</span></div>${renderDay(current,true)}<div class="info-grid"><div class="info"><b>Trip dates</b><span class="small">September 15–27, 2026</span></div><div class="info"><b>Route</b><span class="small">Venice → Florence → Rome → Naples</span></div></div>`;
}

function renderTrip(filter='All'){
  const cities=['All','Venice','Florence','Rome','Naples','Capri'];
  const tabs=cities.map(c=>`<button class="tab ${c===filter?'active':''}" data-city="${c}">${c}</button>`).join('');
  const list=trip.filter(d=>filter==='All'||d.city===filter).map(d=>renderDay(d,false)).join('');
  document.getElementById('tripView').innerHTML=`<div class="section-title"><h2>Full itinerary</h2><span class="small">Tap a day to expand</span></div><div class="tabs">${tabs}</div>${list||'<div class="empty">No days in this view.</div>'}`;
  document.querySelectorAll('[data-city]').forEach(b=>b.addEventListener('click',()=>renderTrip(b.dataset.city)));
  bindDayControls();
}

function renderBookings(){
  const rows=bookings.map((b,i)=>`<label class="checkrow"><input type="checkbox" data-check="booking${i}" ${localStorage.getItem('booking'+i)==='1'?'checked':''}><span><b>${b[1]}</b><div class="small">${b[0]} · ${b[2]}</div></span></label>`).join('');
  document.getElementById('bookingsView').innerHTML=`<div class="section-title"><h2>Bookings</h2><span class="small">Confirmed and planned</span></div><section class="day open"><div class="day-body" style="display:block;padding-top:4px">${rows}</div></section>`;
}

function renderNotes(){
  const saved=localStorage.getItem('italy-notes')||'';
  document.getElementById('notesView').innerHTML=`<div class="section-title"><h2>Trip notes</h2><span class="small">Saved on this device</span></div><section class="day open"><div class="day-body" style="display:block;padding-top:16px"><textarea id="notes" class="note-box" placeholder="Add reservation numbers, meeting points, restaurant ideas, ferry details, or packing reminders...">${saved}</textarea><button id="saveNotes" class="save">Save notes</button><div id="savedMsg" class="small" aria-live="polite" style="margin-top:8px"></div></div></section>`;
  document.getElementById('saveNotes').addEventListener('click',()=>{localStorage.setItem('italy-notes',document.getElementById('notes').value);document.getElementById('savedMsg').textContent='Notes saved.';});
}

function bindDayControls(){
  document.querySelectorAll('.day-head').forEach(btn=>btn.addEventListener('click',()=>{const d=btn.closest('.day');d.classList.toggle('open');btn.setAttribute('aria-expanded',d.classList.contains('open'));}));
  document.querySelectorAll('[data-check]').forEach(cb=>cb.addEventListener('change',()=>localStorage.setItem(cb.dataset.check,cb.checked?'1':'0')));
}

function countdown(){
  const start=new Date('2026-09-15T00:00:00');
  const now=new Date();
  const days=Math.ceil((start-now)/(1000*60*60*24));
  document.getElementById('countdown').textContent=days>0?`${days} days until departure`:days===0?'Departure day!':'Trip underway or completed';
}

document.querySelectorAll('.navbtn').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  document.getElementById(btn.dataset.view).classList.remove('hidden');
}));

renderToday(); renderTrip(); renderBookings(); renderNotes(); bindDayControls(); countdown();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
</script>
</body>
</html>
