:root{--bg:#f5f1e8;--card:#fffdf8;--text:#1e2924;--muted:#6c746f;--accent:#184f3b;--gold:#b88438;--border:#ded8cb;--soft:#edf4ef}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit} .app{max-width:780px;margin:auto;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))}
header{padding:20px 2px 8px} h1{font-size:30px;margin:0} .sub{color:var(--muted);margin-top:6px}
.hero{background:linear-gradient(135deg,#184f3b,#2e755d);color:white;border-radius:24px;padding:20px;margin:10px 0 14px}
.route{font-weight:750;font-size:18px;margin-top:5px} .count{margin-top:10px;font-size:14px;opacity:.92}
.filters{display:flex;gap:8px;overflow:auto;padding:3px 0 12px;scrollbar-width:none} .filters::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:9px 13px;white-space:nowrap} .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:19px;margin-bottom:12px;overflow:hidden}
.dayhead{width:100%;border:0;background:transparent;text-align:left;padding:15px;display:flex;justify-content:space-between;gap:12px;color:inherit}
.date{font-weight:780} .city{color:var(--accent);font-size:13px;margin-top:3px} .chev{font-size:20px;color:var(--muted)}
.body{display:none;padding:0 15px 15px} .card.open .body{display:block}
.event{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--border)}
.time{font-weight:750;color:var(--accent)} .title{font-weight:740} .note{font-size:14px;color:var(--muted);line-height:1.4;margin-top:3px}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:4px 8px;margin-top:6px;background:var(--soft);color:var(--accent)}
.badge.warn{background:#f6eee0;color:#7a551d} .map{display:inline-block;margin-top:8px;text-decoration:none;border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:11px;background:white}
.section h2{font-size:20px;margin:8px 2px 10px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info{background:var(--card);border:1px solid var(--border);border-radius:17px;padding:14px} .info b{display:block;margin-bottom:5px} .small{font-size:13px;color:var(--muted)}
.statusrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)} .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:5px;flex:none}
textarea{width:100%;min-height:130px;border:1px solid var(--border);border-radius:14px;padding:12px;background:white;color:inherit} .save{border:0;background:var(--accent);color:white;border-radius:12px;padding:10px 14px;margin-top:8px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(750px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(255,253,248,.96);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:22px;padding:7px}
.nav{border:0;background:transparent;border-radius:14px;padding:10px 3px;color:var(--muted);font-size:12px} .nav.active{background:var(--accent);color:white}
.hidden{display:none!important} .callout{background:var(--soft);border:1px solid #cbdcd1;border-radius:16px;padding:13px;margin-bottom:12px;line-height:1.4}
@media(max-width:520px){.grid{grid-template-columns:1fr}.event{grid-template-columns:68px 1fr}h1{font-size:27px}}
</style>
</head>

hborhood and have dinner there.", "map": "https://www.google.com/maps/search/?api=1&query=Trastevere+Rome"}]}, {"date": "2026-09-23", "city": "Rome", "title": "North-central Rome and Aventine sunset route", "events": [{"time": "Morning", "title": "Spanish Steps", "note": "Start early before the area becomes busiest.", "map": "https://www.google.com/maps/search/?api=1&query=Spanish+Steps"}, {"time": "Morning", "title": "Via del Corso, Piazza del Popolo and Pincian Terrace", "note": "Walk north through Rome’s shopping spine and continue to the panoramic terrace."}, {"time": "Late morning", "title": "Villa Borghese", "note": "Enjoy the park; the gallery itself is not currently listed as booked.", "map": "https://www.google.com/maps/search/?api=1&query=Villa+Borghese"}, {"time": "Afternoon", "title": "Jewish Ghetto and Theatre of Marcellus", "note": "Explore the historic district and nearby ancient theater.", "map": "https://www.google.com/maps/search/?api=1&query=Jewish+Ghetto+Rome"}, {"time": "Afternoon", "title": "Tiber Island", "note": "Cross toward the island before continuing south."}, {"time": "Late afternoon", "title": "Orange Garden and Aventine Keyhole", "note": "Finish with views from the Orange Garden and the famous keyhole perspective.", "map": "https://www.google.com/maps/dir/?api=1&origin=Tiber+Island&destination=Aventine+Keyhole&waypoints=Orange+Garden+Rome"}, {"time": "Evening", "title": "Final Rome dinner", "note": "Choose a memorable last dinner in Rome."}]}, {"date": "2026-09-24", "city": "Naples", "title": "Train to Naples and historic-center exploration", "events": [{"time": "Morning", "title": "Checkout and station transfer", "note": "Head to Roma Termini with enough luggage buffer."}, {"time": "9:41 AM", "title": "Italo 9967 — Rome to Naples", "note": "Arrives Napoli Centrale at 10:53 AM.", "status": "Booked"}, {"time": "Late morning", "title": "Check in at Napolinn B&B", "note": "Leave luggage if the room is not ready.", "map": "https://www.goog function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
function card(d,open=false){
 return `<article class="card ${open?'open':''}" data-city="${d.city}">
 <button class="dayhead"><div><div class="date">${fmtDate(d.date)} — ${d.title}</div><div class="city">${d.city}</div></div><div class="chev">⌄</div></button>
 <div class="body">${d.events.map(e=>`<div class="event"><div class="time">${e.time}</div><div><div class="title">${e.title}</div><div class="note">${e.note}</div>${e.status?`<span class="badge ${e.status==='To book'?'warn':''}">${e.status}</span>`:''}${e.map?`<br><a class="map" href="${e.map}" target="_blank" rel="noopener">Open in Maps</a>`:''}</div></div>`).join('')}</div></article>`}
function bindCards(){document.querySelectorAll('.dayhead').forEach(b=>b.addEventListener('click',()=>b.closest('.card').classList.toggle('open')))}

const start=new Date('2026-09-14T00:00:00'); const end=new Date('2026-09-27T23:59:59'); const now=new Date();
const diff=Math.ceil((start-now)/86400000);

document.getElementById('today').innerHTML=`<div class="section"><h2>Today</h2>${todayItem?card(todayItem,true):`<div class="callout">During the trip, this screen will automatically show only the current day. For now, use <b>Full Trip</b> to browse every date.</div>${card(trip[0],true)}`}</div>`;

<div class="section"><h2>Hotels</h2><div class="grid">${hotels.map(h=>`<div class="info"><b>${h[0]} — ${h[1]}</b><div class="small">${h[3]}${h[2]?'<br>'+h[2]:''}</div></div>`).join('')}</div></div>
<div class="section"><h2>Remaining reservations</h2><div class="card" style="padding:0 14px">${remaining.map(r=>`<div class="statusrow"><span class="dot"></span><div><b>${r[0]}</b><div class="small">${r[1]}</div></div></div>`).join('')}</div></div>
<div class="section"><h2>Trip status</h2><div class="card" style="padding:0 14px">${['Flights: Complete','Hotels: Complete','Intercity trains: Complete','Capri ferry: Complete','Venice reservations: Complete','Florence reservations: Complete','Vatican reservations: Complete','Wine tour: Complete','Capri boat tour: Complete','Pompeii & Mount Vesuvius tour: Complete','Colosseum: Remaining'].map(x=>`<div class="statusrow"><span class="dot"></span><div>${x}</div></div>`).join('')}</div></div>`;

document.getElementById('notes').innerHTML=`<div class="section"><h2>Trip notes</h2><div class="callout">Notes save only on this device and browser.</div><textarea id="noteBox" placeholder="Reservation numbers, restaurant ideas, reminders..."></textarea><button class="save" id="saveNotes">Save notes</button><div class="small" id="savedMsg" style="margin-top:8px"></div></div>`;
try{document.getElementById('noteBox').value=localStorage.getItem('italyNotes')||''}catch(e){}
document.getElementById('saveNotes').addEventListener('click',()=>{try{localStorage.setItem('italyNotes',document.getElementById('noteBox').value);document.getElementById('savedMsg').textContent='Saved on this device.'}catch(e){document.getElementById('savedMsg').textContent='Notes could not be saved in this browser.'}});

document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');
 document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));document.getElementById(b.dataset.target).classList.remove('hidden');
 window.scrollTo({top:0,behavior:'smooth'});
}));
bindCards();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
