name: Apply Guide scroll memory fix

on:
  push:
    branches:
      - agent/fix-guide-scroll-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-guide-scroll-memory
          fetch-depth: 0

      - name: Fix scroll save and restore timing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          nav = Path('navigation-state.js')
          text = nav.read_text(encoding='utf-8')

          old_save = '''  function saveCurrentPosition() {
    const view = currentView();
    write(`scroll-${view}`, Math.max(0, Math.round(window.scrollY)));
    write("last-view", view);
    if (view === "guide") saveGuideSelections();
    if (view === "trip") saveTripSelections();
  }
'''
          new_save = '''  function saveCurrentPosition(view = currentView(), top = window.scrollY) {
    write(`scroll-${view}`, Math.max(0, Math.round(top)));
    write("last-view", view);
    if (view === "guide") saveGuideSelections();
    if (view === "trip") saveTripSelections();
  }
'''

          old_restore = '''        setTimeout(() => {
          window.scrollTo({ top, left: 0, behavior: "auto" });
          restoringScroll = false;
        }, 80);
'''
          new_restore = '''        setTimeout(() => {
          window.scrollTo({ top, left: 0, behavior: "auto" });
        }, 120);
        setTimeout(() => {
          window.scrollTo({ top, left: 0, behavior: "auto" });
          restoringScroll = false;
        }, 450);
'''

          old_show = '''    const previous = currentView();
    if (previous !== target) saveCurrentPosition();

    originalShowView(target, updateTab);
'''
          new_show = '''    const previous = currentView();
    if (previous !== target) {
      clearTimeout(scrollSaveTimer);
      saveCurrentPosition(previous, window.scrollY);
    }

    restoringScroll = true;
    originalShowView(target, updateTab);
'''

          old_scroll = '''  window.addEventListener("scroll", () => {
    if (restoringScroll) return;
    clearTimeout(scrollSaveTimer);
    scrollSaveTimer = setTimeout(saveCurrentPosition, 120);
  }, { passive: true });
'''
          new_scroll = '''  window.addEventListener("scroll", () => {
    if (restoringScroll) return;
    const view = currentView();
    const top = window.scrollY;
    clearTimeout(scrollSaveTimer);
    scrollSaveTimer = setTimeout(() => saveCurrentPosition(view, top), 120);
  }, { passive: true });
'''

          replacements = [
              (old_save, new_save, 'saveCurrentPosition'),
              (old_restore, new_restore, 'restoreScroll timing'),
              (old_show, new_show, 'showView timing'),
              (old_scroll, new_scroll, 'scroll handler'),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f'Expected {label} block was not found')
              text = text.replace(old, new, 1)
          nav.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          old_cache = "const CACHE='italy-2026-navigation-state-v1';"
          new_cache = "const CACHE='italy-2026-navigation-state-v2';"
          if old_cache not in sw_text:
              raise SystemExit('Expected service-worker cache version was not found')
          sw.write_text(sw_text.replace(old_cache, new_cache, 1), encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check navigation-state.js
          node --check sw.js

      - name: Commit focused fix
        run: |
          rm .github/workflows/apply-guide-scroll-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add navigation-state.js sw.js .github/workflows/apply-guide-scroll-fix.yml
          git commit -m "Fix Guide scroll restoration"
          git push origin HEAD:agent/fix-guide-scroll-memory
